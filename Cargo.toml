[package]
name = "snaptrade"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Unofficial Rust client for the SnapTrade brokerage-aggregation API: HMAC-SHA256 signed requests, pagination, rate-limit backoff, typed errors. Trading endpoints are behind the off-by-default `trading` feature."
readme = "README.md"
keywords = ["snaptrade", "brokerage", "finance", "api-client", "portfolio"]
categories = ["api-bindings", "finance"]

[features]
default = []
# Order, quote and trade endpoints. OFF by default: the default build cannot
# place, replace or cancel orders, and does not even read order history.
trading = []
# Builds the `snaptrade` command-line binary.
cli = ["dep:clap"]

[lib]
name = "snaptrade"
path = "src/lib.rs"

[[bin]]
name = "snaptrade"
path = "src/bin/snaptrade.rs"
required-features = ["cli"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"], optional = true }
csv = "1"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
